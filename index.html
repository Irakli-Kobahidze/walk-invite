<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta property="og:title" content="Пойдёшь гулять?">
<meta property="og:description" content="Тебе приглашение на прогулку 🍂">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Пойдёшь гулять?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Neucha&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: одна карточка-открытка по центру вечернего осеннего неба, шаги сменяют друг друга внутри неё. Единый «сумеречный» образ для обеих тем. */
:root {
  --sky-top: #1d2140;
  --sky-low: #4a2f4f;
  --card: #fbf3e6;
  --ink: #2a2236;
  --muted: #7a6c78;
  --lamp: #f2a541;
  --lamp-deep: #c9742a;
  --leaf: #b8462e;
  --line: #e6d6bf;
  --font-hand: "Neucha", "Comic Sans MS", cursive;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { min-height: 100%; }
body {
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-low) 100%) fixed;
  background-color: var(--sky-top);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  overflow-x: hidden;
}
#leaves { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.moon {
  position: fixed; top: calc(28px + env(safe-area-inset-top, 0px)); right: max(28px, env(safe-area-inset-right, 0px));
  width: 64px; height: 64px; border-radius: 50%;
  background: radial-gradient(circle at 38% 38%, #fff7df, #f3dca6 70%);
  box-shadow: 0 0 60px 18px rgba(243, 220, 166, .25);
  z-index: 0;
}
.card {
  position: relative; z-index: 1;
  width: 100%; max-width: 460px;
  background: var(--card);
  border-radius: 22px;
  padding: 28px 24px 24px;
  box-shadow: 0 30px 60px -20px rgba(0,0,0,.55);
  margin-top: 40px;
}
.stamp {
  position: absolute; top: -18px; right: 22px;
  background: var(--leaf); color: #fff3e3;
  font-family: var(--font-hand); font-size: 15px;
  padding: 6px 12px; border-radius: 6px; transform: rotate(4deg);
  letter-spacing: .04em;
}
.eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--lamp-deep); }
h1, h2 { font-family: var(--font-hand); font-weight: 400; text-wrap: balance; margin: 6px 0 10px; line-height: 1.05; }
h1 { font-size: clamp(44px, 12vw, 60px); }
h2 { font-size: 34px; }
p { margin: 0 0 14px; line-height: 1.5; color: var(--muted); }
.step { display: flex; flex-direction: column; gap: 4px; animation: rise .45s ease both; }
@keyframes rise { from { transform: translateY(10px); opacity: .4; } to { transform: none; opacity: 1; } }

.lantern { display: block; margin: 4px auto 14px; width: 92px; height: auto; }
.lantern .glow { animation: flicker 3s ease-in-out infinite; transform-origin: center; }
@keyframes flicker { 0%,100% { opacity: .9; } 45% { opacity: .65; } 60% { opacity: 1; } }

.yesno { position: relative; display: flex; gap: 12px; justify-content: center; align-items: center; min-height: 120px; margin-top: 8px; }
button { font: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible { outline: 3px solid var(--lamp); outline-offset: 2px; }
.btn {
  border: 0; border-radius: 999px; padding: 14px 26px;
  font-weight: 800; font-size: 17px;
  transition: transform .15s ease, background .15s ease;
}
.btn-yes { background: var(--lamp); color: var(--ink); box-shadow: 0 6px 0 var(--lamp-deep); }
.btn-yes:hover { transform: translateY(-2px); }
.btn-yes:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--lamp-deep); }
.yesno { flex-wrap: wrap; min-height: 170px; touch-action: manipulation; }
.btn-no { background: transparent; color: var(--muted); border: 2px dashed var(--line); transition: left .25s ease, top .25s ease, transform .15s; }
.btn-no.loose { position: absolute; }
.hint { text-align: center; min-height: 22px; font-family: var(--font-hand); font-size: 19px; color: var(--leaf); margin-top: 6px; }

.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 6px 0 4px; }
.opt {
  text-align: left; background: #fffaf2; border: 2px solid var(--line); border-radius: 14px;
  padding: 12px; color: var(--ink); display: flex; flex-direction: column; gap: 4px; min-width: 0;
  transition: border-color .15s, background .15s, transform .15s;
}
.opt:hover { transform: translateY(-2px); }
.opt[aria-pressed="true"] { border-color: var(--lamp); background: #fdebc8; }
.opt .ico { font-size: 26px; line-height: 1; }
.opt b { font-size: 15px; }
.opt small { color: var(--muted); font-size: 12.5px; line-height: 1.35; }

.label { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  background: #fffaf2; border: 2px solid var(--line); border-radius: 999px;
  padding: 8px 14px; font-weight: 600; font-size: 14.5px; color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.chip[aria-pressed="true"] { border-color: var(--lamp); background: #fdebc8; }
.chip small { color: var(--muted); font-weight: 400; margin-left: 4px; }

textarea {
  width: 100%; box-sizing: border-box; min-height: 74px; resize: vertical;
  border: 2px solid var(--line); border-radius: 14px; background: #fffaf2;
  padding: 10px 12px; font: inherit; font-size: 15px; color: var(--ink);
}

.nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 18px; }
.link { background: none; border: 0; color: var(--muted); font-weight: 600; padding: 8px 4px; }
.link:hover { color: var(--ink); }
.btn-next { background: var(--ink); color: var(--card); }
.btn-next:disabled { opacity: .35; cursor: not-allowed; }
.dots { display: flex; gap: 6px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--lamp-deep); }

.ticket {
  position: relative; margin: 8px 0 4px; border-radius: 16px;
  background: repeating-linear-gradient(135deg, #fdebc8 0 14px, #fbe3b5 14px 28px);
  padding: 18px 18px 16px; border: 2px dashed var(--lamp-deep);
}
.ticket dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 14px; margin: 0; }
.ticket dt { font-size: 11.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--lamp-deep); padding-top: 3px; }
.ticket dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.ticket .seal { position: absolute; right: 12px; bottom: -14px; font-family: var(--font-hand); background: var(--leaf); color: #fff3e3; padding: 4px 10px; border-radius: 6px; transform: rotate(-5deg); }
.copybox { margin-top: 22px; display: flex; flex-direction: column; gap: 8px; }
.copybox pre {
  margin: 0; white-space: pre-wrap; word-break: break-word; font-family: var(--font-body); font-size: 13.5px;
  background: #fffaf2; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; color: var(--ink);
  user-select: all;
}
.toast { font-family: var(--font-hand); font-size: 18px; color: var(--leaf); text-align: center; min-height: 22px; }
.sad { text-align: center; }

@media (max-width: 380px) {
  .card { padding: 24px 16px 20px; }
  .grid { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  .step, .lantern .glow { animation: none; }
  .btn, .opt, .btn-no { transition: none; }
}
</style>

<canvas id="leaves" aria-hidden="true"></canvas>
<div class="moon" aria-hidden="true"></div>

<main class="card" id="card">
  <span class="stamp">приглашение</span>
  <div id="view"></div>
</main>

<script>
(() => {
  const PLACES = [
    { id: "park", ico: "🍂", name: "Парк", desc: "Шуршать листьями и болтать обо всём" },
    { id: "coffee", ico: "☕", name: "Кофе с собой", desc: "Тёплый стаканчик в руках и долгий маршрут" },
    { id: "cinema", ico: "🎬", name: "Прогулка + кино", desc: "Сначала погулять, потом фильм" },
    { id: "surprise", ico: "🎁", name: "Сюрприз", desc: "Доверяю тебе выбрать место" }
  ];
  const TIMES = ["12:00", "15:00", "17:00", "18:30", "20:00"];
  const EXTRAS = ["горячий шоколад", "фотки на плёнку", "плед", "плейлист на двоих", "пончики", "долгий разговор"];

  const WD = ["вс", "пн", "вт", "ср", "чт", "пт", "сб"];
  const MON = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
  const today = new Date();
  const DAYS = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(today); d.setDate(today.getDate() + i);
    const label = i === 0 ? "Сегодня" : i === 1 ? "Завтра" : d.getDate() + " " + MON[d.getMonth()];
    return { id: String(i), label, sub: WD[d.getDay()], full: d.getDate() + " " + MON[d.getMonth()] + ", " + WD[d.getDay()] };
  });

  const s = { step: 0, place: null, day: null, time: null, extras: [], note: "", dodges: 0 };
  const view = document.getElementById("view");
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const dots = n => '<div class="dots" aria-label="Шаг ' + n + ' из 3">' + [1,2,3].map(i => '<i class="' + (i <= n ? "on" : "") + '"></i>').join("") + "</div>";

  const lantern = `<svg class="lantern" viewBox="0 0 100 130" aria-hidden="true">
    <circle class="glow" cx="50" cy="72" r="42" fill="#f2a541" opacity=".22"/>
    <path d="M50 4 v14" stroke="#2a2236" stroke-width="3" stroke-linecap="round"/>
    <path d="M34 22 h32 l-4 10 h-24z" fill="#2a2236"/>
    <path d="M38 32 h24 l6 56 h-36z" fill="#f2a541" stroke="#2a2236" stroke-width="3" stroke-linejoin="round"/>
    <path class="glow" d="M50 50 c6 8 6 16 0 22 c-6-6-6-14 0-22z" fill="#fff3d6"/>
    <path d="M28 88 h44 v8 h-44z" fill="#2a2236"/>
    <path d="M50 32 v56" stroke="#2a2236" stroke-width="2" opacity=".35"/>
  </svg>`;

  const NO_LINES = ["Ой, промахнулся(-ась) 🙂", "Кнопка стесняется", "Она сегодня не работает", "Попробуй ещё… или нет", "Кажется, это знак", "Есть только один правильный ответ 😉", "Не догонишь!", "Кнопка «Да» вон там 👈"];

  function render() {
    const st = s.step;
    if (st === 0) {
      view.innerHTML = `<section class="step">
        ${lantern}
        <div class="eyebrow">Вопрос на вечер</div>
        <h1>Пойдёшь со мной гулять?</h1>
        <p>Октябрь, листья, фонари и тёплый кофе. Не хватает только тебя.</p>
        <div class="yesno" id="yn">
          <button class="btn btn-yes" id="yes">Да, пойду!</button>
          <button class="btn btn-no" id="no" tabindex="-1">Нет</button>
        </div>
        <div class="hint" id="hint" aria-live="polite"></div>
      </section>`;
      const yn = document.getElementById("yn"), no = document.getElementById("no"), yes = document.getElementById("yes");
      // Тап по «Нет» на телефоне не должен долетать до «Да»
      let noTouchedAt = 0;
      yes.onclick = () => { if (Date.now() - noTouchedAt > 600) go(1); };
      no.addEventListener("touchstart", e => { e.preventDefault(); noTouchedAt = Date.now(); const t = e.touches[0]; dodge(t.clientX, t.clientY); }, { passive: false });
      // «Нет» убегает всегда: от приближения курсора, касания и клика
      const dodge = (px, py) => {
        s.dodges++;
        if (!no.classList.contains("loose")) {
          // Пустое место на прежней позиции, чтобы «Да» не съехало под палец
          const ph = document.createElement("span");
          ph.style.cssText = "display:inline-block;width:" + no.offsetWidth + "px;height:" + no.offsetHeight + "px";
          yn.insertBefore(ph, no);
          const r0 = no.getBoundingClientRect(), b0 = yn.getBoundingClientRect();
          no.classList.add("loose");
          no.style.left = (r0.left - b0.left) + "px";
          no.style.top = (r0.top - b0.top) + "px";
          no.offsetWidth;
        }
        const box = yn.getBoundingClientRect(), yb = yes.getBoundingClientRect();
        const w = no.offsetWidth, h = no.offsetHeight;
        let x = 0, y = 0;
        for (let i = 0; i < 20; i++) {
          x = Math.random() * Math.max(0, box.width - w);
          y = Math.random() * Math.max(0, box.height - h);
          const cx = box.left + x + w / 2, cy = box.top + y + h / 2;
          const overYes = cx > yb.left - w / 2 - 8 && cx < yb.right + w / 2 + 8 && cy > yb.top - h / 2 - 8 && cy < yb.bottom + h / 2 + 8;
          const far = px == null || Math.hypot(cx - px, cy - py) > 110;
          if (!overYes && far) break;
        }
        no.style.left = x + "px";
        no.style.top = y + "px";
        document.getElementById("hint").textContent = NO_LINES[(s.dodges - 1) % NO_LINES.length];
      };
      yn.addEventListener("pointermove", e => {
        if (e.pointerType !== "mouse") return;
        const r = no.getBoundingClientRect();
        const dx = Math.max(r.left - e.clientX, 0, e.clientX - r.right);
        const dy = Math.max(r.top - e.clientY, 0, e.clientY - r.bottom);
        if (Math.hypot(dx, dy) < 40) dodge(e.clientX, e.clientY);
      });
      no.addEventListener("pointerdown", e => { e.preventDefault(); if (e.pointerType !== "touch") dodge(e.clientX, e.clientY); else noTouchedAt = Date.now(); });
      no.addEventListener("click", e => { e.preventDefault(); dodge(e.clientX, e.clientY); });
      return;
    }
    if (st === 1) {
      view.innerHTML = `<section class="step">
        <div class="eyebrow">Ура! Шаг 1 · куда</div>
        <h2>Выбери место</h2>
        <div class="grid">${PLACES.map(p => `<button class="opt" data-id="${p.id}" aria-pressed="${s.place === p.id}">
          <span class="ico" aria-hidden="true">${p.ico}</span><b>${p.name}</b><small>${p.desc}</small></button>`).join("")}</div>
        <div class="nav"><button class="link" id="prev">← Назад</button>${dots(1)}<button class="btn btn-next" id="next" ${s.place ? "" : "disabled"}>Дальше</button></div>
      </section>`;
      view.querySelectorAll(".opt").forEach(b => b.onclick = () => { s.place = b.dataset.id; render(); });
    }
    if (st === 2) {
      view.innerHTML = `<section class="step">
        <div class="eyebrow">Шаг 2 · когда</div>
        <h2>Выбери день и время</h2>
        <div class="label">День</div>
        <div class="chips">${DAYS.map(d => `<button class="chip" data-day="${d.id}" aria-pressed="${s.day === d.id}">${d.label}<small>${d.sub}</small></button>`).join("")}</div>
        <div class="label">Время</div>
        <div class="chips">${TIMES.map(t => `<button class="chip" data-time="${t}" aria-pressed="${s.time === t}">${t}</button>`).join("")}</div>
        <div class="nav"><button class="link" id="prev">← Назад</button>${dots(2)}<button class="btn btn-next" id="next" ${s.day && s.time ? "" : "disabled"}>Готово</button></div>
      </section>`;
      view.querySelectorAll("[data-day]").forEach(b => b.onclick = () => { s.day = b.dataset.day; render(); });
      view.querySelectorAll("[data-time]").forEach(b => b.onclick = () => { s.time = b.dataset.time; render(); });
    }
    if (st === 3) {
      const p = PLACES.find(x => x.id === s.place);
      const d = DAYS.find(x => x.id === s.day);
      const text = answerText(p, d);
      view.innerHTML = `<section class="step">
        <div class="eyebrow">Шаг 3 · билет</div>
        <h2>Свидание назначено!</h2>
        <div class="ticket">
          <dl>
            <dt>Куда</dt><dd>${p.ico} ${p.name}</dd>
            <dt>Когда</dt><dd>${d.label === d.full.split(",")[0] ? d.full : d.label + " · " + d.full}, ${s.time}</dd>
            <dt>Берём</dt><dd>хорошее настроение</dd>
          </dl>
          <span class="seal">до встречи</span>
        </div>
        <div class="copybox">
          <p style="margin:0">Скопируй ответ и отправь мне в сообщения:</p>
          <pre id="ans">${esc(text)}</pre>
          <button class="btn btn-yes" id="copy">Скопировать ответ</button>
          <div class="toast" id="toast" aria-live="polite"></div>
        </div>
        <div class="nav"><button class="link" id="prev">← Изменить</button>${dots(3)}<span></span></div>
      </section>`;
      document.getElementById("copy").onclick = async () => {
        const t = document.getElementById("toast");
        try { await navigator.clipboard.writeText(text); t.textContent = "Скопировано! Теперь вставь в чат 💌"; }
        catch (e) {
          const r = document.createRange(); r.selectNodeContents(document.getElementById("ans"));
          const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
          t.textContent = "Текст выделен, скопируй его вручную";
        }
      };
    }
    const prev = document.getElementById("prev"), next = document.getElementById("next");
    if (prev) prev.onclick = () => go(st - 1);
    if (next) next.onclick = () => go(st + 1);
  }

  function answerText(p, d) {
    let t = "Да, пойду гулять! 🍂\n" +
      "Куда: " + p.name + "\n" +
      "Когда: " + d.full + ", " + s.time;
    return t;
  }

  function go(n) { s.step = n; render(); document.getElementById("card").scrollIntoView({ block: "start", behavior: "smooth" }); }
  render();

  // Падающие листья
  const cv = document.getElementById("leaves"), ctx = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const COLORS = ["#c9742a", "#b8462e", "#e0a33b", "#8f3a2a"];
  let W, H, leaves = [];
  function size() { const r = devicePixelRatio || 1; W = innerWidth; H = innerHeight; cv.width = W * r; cv.height = H * r; ctx.setTransform(r, 0, 0, r, 0, 0); }
  function mk(y) { return { x: Math.random() * W, y: y ?? -20, s: 6 + Math.random() * 8, vy: .4 + Math.random() * .8, a: Math.random() * 6.28, va: (Math.random() - .5) * .04, sw: Math.random() * 6.28, c: COLORS[Math.random() * COLORS.length | 0] }; }
  function leaf(l) {
    ctx.save(); ctx.translate(l.x, l.y); ctx.rotate(l.a); ctx.fillStyle = l.c; ctx.globalAlpha = .85;
    ctx.beginPath(); ctx.moveTo(0, -l.s); ctx.quadraticCurveTo(l.s * .9, 0, 0, l.s); ctx.quadraticCurveTo(-l.s * .9, 0, 0, -l.s); ctx.fill(); ctx.restore();
  }
  function frame() {
    ctx.clearRect(0, 0, W, H);
    for (const l of leaves) {
      if (!reduce) { l.sw += .02; l.y += l.vy; l.x += Math.sin(l.sw) * .6; l.a += l.va; if (l.y > H + 20) Object.assign(l, mk()); }
      leaf(l);
    }
    if (!reduce) requestAnimationFrame(frame);
  }
  size(); addEventListener("resize", size);
  leaves = Array.from({ length: Math.min(28, Math.round(W / 40)) }, () => mk(Math.random() * H));
  frame();
})();
</script>

</body>
</html>
